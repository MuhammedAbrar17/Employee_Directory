
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="mb-4">
            <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                &larr; Back to Employees
            </a>
        </div>

        <div class="card shadow-sm border-0 mx-auto"
             style="max-width: 700px;">

            <div class="card-header bg-primary text-white py-3">
                <h3 class="mb-0">Employee Details</h3>
            </div>

            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <div class="rounded-circle bg-light border
                                d-inline-flex align-items-center
                                justify-content-center"
                         style="width: 100px; height: 100px;">
                        <span class="fs-1 text-secondary">👤</span>
                    </div>
                    <h4 class="mt-3">{{ employee.first_name }}</h4>
                    <p class="text-muted mb-0">{{ employee.designation }}</p>
                </div>

                <hr>

                <h5 class="mb-3">Personal Information</h5>

                <div class="row mb-3">
                    <div class="col-sm-4 text-muted">First Name</div>
                    <div class="col-sm-8">{{employee.first_name}}</div>
                </div>

                <div class="row mb-3">
                    <div class="col-sm-4 text-muted">Designation</div>
                    <div class="col-sm-8">{{employee.designation}}</div>
                </div>

                <div class="row mb-3">
                    <div class="col-sm-4 text-muted">Phone Number</div>
                    <div class="col-sm-8">{{employee.phone_number}}</div>
                </div>

                <hr>

                <div class="d-flex justify-content-end gap-2">
                    <a href="#" class="btn btn-outline-secondary">
                        Back
                    </a>

                    <button type="button" class="btn btn-primary">
                        Edit Details
                    </button>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
